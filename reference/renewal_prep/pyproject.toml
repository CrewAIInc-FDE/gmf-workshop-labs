[project]
name = "renewal_prep"
version = "0.1.0"
description = "Reference: renewal pipeline with policy-grounded offers"
requires-python = ">=3.10,<3.14"
dependencies = ["crewai[tools]==1.15.23", "python-dotenv>=1.0"]

[project.scripts]
renewal_prep = "renewal_prep.main:run"
run_crew = "renewal_prep.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
project_id = "b248db0f-3abf-4da8-b4ce-5abec824d9df"
