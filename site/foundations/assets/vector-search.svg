<circle cx="480" cy="225" r="22" fill="#EDEDED" stroke="#161616" stroke-width="4"/>
<text x="480" y="235" text-anchor="middle" font-size="28" font-weight="600" fill="#161616">1</text>
<line x1="390" y1="240" x2="310" y2="300" stroke="#161616" stroke-width="3"/>
<circle cx="310" cy="300" r="22" fill="#EDEDED" stroke="#161616" stroke-width="4"/>
<text x="310" y="310" text-anchor="middle" font-size="28" font-weight="600" fill="#161616">2</text>
<line x1="390" y1="240" x2="475" y2="315" stroke="#161616" stroke-width="3"/>
