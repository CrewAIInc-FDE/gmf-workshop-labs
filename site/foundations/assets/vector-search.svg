<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1920" height="704" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">Vector search: question to nearest neighbours</title><desc id="d">A map on the left with grey pins for policies and one coral pin for the question. The three pins nearest the question are numbered 1, 2 and 3. On the right, a list says the nearest pins come back, closest first.</desc>
