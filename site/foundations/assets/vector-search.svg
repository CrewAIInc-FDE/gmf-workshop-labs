<text x="390" y="56" text-anchor="middle" font-size="32" font-weight="600" fill="#161616">Your question</text>
<line x1="390" y1="70" x2="390" y2="214" stroke="#161616" stroke-width="3" marker-end="url(#a)"/>
<text x="760" y="80" text-anchor="start" font-size="34" font-weight="600" fill="#161616">1. Drop a pin</text>
<text x="760" y="122" text-anchor="start" font-size="30" font-weight="400" fill="#686868">for the question</text>
<text x="760" y="205" text-anchor="start" font-size="34" font-weight="600" fill="#161616">2. Look nearby</text>
<text x="760" y="247" text-anchor="start" font-size="30" font-weight="400" fill="#686868">at the closest pins</text>
<text x="760" y="330" text-anchor="start" font-size="34" font-weight="600" fill="#161616">3. Return them</text>
<text x="760" y="372" text-anchor="start" font-size="30" font-weight="400" fill="#686868">closest first</text>
