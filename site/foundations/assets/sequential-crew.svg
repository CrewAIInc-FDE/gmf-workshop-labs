<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="t d" font-family="Inter, sans-serif">
  <title id="t">A crew of three agents working in order</title>
  <desc id="d">An intake agent passes its output to a policy agent, which passes its output to a reply agent. The policy agent, which uses the policy search tool, is highlighted.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#161616"/>
    </marker>
  </defs>
  <rect width="1200" height="420" fill="#F5F3F0"/>
  <g stroke="#CCC5B9" stroke-width="3">
    <rect x="30" y="90" width="320" height="190" rx="22" fill="#EDEDED"/>
    <rect x="440" y="90" width="320" height="190" rx="22" fill="#EDEDED" stroke="#FF5A50" stroke-width="6"/>
    <rect x="850" y="90" width="320" height="190" rx="22" fill="#EDEDED"/>
  </g>
  <g fill="#161616" text-anchor="middle" font-size="36" font-weight="600">
    <text x="190" y="160">Intake agent</text>
    <text x="600" y="160">Policy agent</text>
    <text x="1010" y="160">Reply agent</text>
  </g>
  <g fill="#686868" text-anchor="middle" font-size="26">
    <text x="190" y="215">Reads the question</text>
    <text x="600" y="215">Finds the policy</text>
    <text x="1010" y="215">Writes the answer</text>
  </g>
  <g stroke="#161616" stroke-width="5" marker-end="url(#arrow)">
    <line x1="352" y1="185" x2="436" y2="185"/>
    <line x1="762" y1="185" x2="846" y2="185"/>
  </g>
  <text x="600" y="362" text-anchor="middle" fill="#161616" font-size="28">Tool: search the Northwind policy library</text>
  <line x1="600" y1="284" x2="600" y2="318" stroke="#161616" stroke-width="4" marker-end="url(#arrow)"/>
</svg>
