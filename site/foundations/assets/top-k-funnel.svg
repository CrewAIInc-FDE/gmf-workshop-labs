<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1920" height="704" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">Top-k funnel</title><desc id="d">A funnel narrowing from left to right. The wide end is the whole library, 15 policies in this demo, ranked closest first. The narrow end is the top k, the few policies handed to the model. An arrow leads to the model, which writes the answer. Below: too few misses a condition, too many buries the answer.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#161616"/></marker></defs>
<rect width="1200" height="440" fill="#F5F3F0"/>
<polygon points="20,40 700,140 700,260 20,360" fill="#EDEDED" stroke="#CCC5B9" stroke-width="3"/>
<text x="330" y="175" text-anchor="middle" font-size="36" font-weight="600" fill="#161616">The whole library</text>
<text x="330" y="225" text-anchor="middle" font-size="30" font-weight="400" fill="#686868">ranked, closest first</text>
<rect x="700" y="140" width="190" height="120" rx="14" fill="#FF5A50" stroke="#161616" stroke-width="4"/>
<text x="795" y="185" text-anchor="middle" font-size="38" font-weight="700" fill="#161616">Top k</text>
<text x="795" y="232" text-anchor="middle" font-size="30" font-weight="400" fill="#161616">(say 3)</text>
<line x1="895" y1="200" x2="965" y2="200" stroke="#161616" stroke-width="5" marker-end="url(#a)"/>
<rect x="970" y="120" width="220" height="160" rx="18" fill="#EDEDED" stroke="#CCC5B9" stroke-width="3"/>
<text x="1080" y="188" text-anchor="middle" font-size="34" font-weight="600" fill="#161616">The model</text>
<text x="1080" y="232" text-anchor="middle" font-size="28" font-weight="400" fill="#686868">reads only these</text>
<text x="600" y="405" text-anchor="middle" font-size="32" font-weight="600" fill="#161616">Too few misses a condition. Too many buries the answer.</text>
</svg>
