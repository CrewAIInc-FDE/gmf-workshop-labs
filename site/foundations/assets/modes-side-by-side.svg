<title id="t">Three search modes side by side</title><desc id="d">Two questions, three search modes. Deployed overseas with the Army: keyword puts Refinancing first and does not return the right policy; semantic puts Servicemember Protections first, which is right; hybrid puts Refinancing first with the right policy third. For 84 months: keyword puts Payment Deferral first, which is right; semantic does not return it; hybrid puts Payment Deferral first, which is right.</desc>
