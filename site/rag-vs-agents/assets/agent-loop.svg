<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="1200" height="540" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">The agent loop</title><desc id="d">A goal goes into a loop of three steps: decide the next step, use a tool, look at the result, then back to deciding. The use-a-tool step is highlighted. When the job is done the loop ends with an answer or action. Caption: the flexible part is the choice at each step, which is the point of an agent and the part you constrain.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#161616"/></marker></defs>
<rect width="1200" height="540" fill="#F5F3F0"/>
<rect x="20" y="150" width="190" height="150" rx="20" fill="#EDEDED" stroke="#CCC5B9" stroke-width="3"/>
<text x="115.0" y="218" text-anchor="middle" font-size="32" font-weight="600" fill="#161616">Goal</text>
<text x="115.0" y="262" text-anchor="middle" font-size="28" fill="#686868">a job to do</text>
<line x1="212" y1="225" x2="262" y2="225" stroke="#161616" stroke-width="5" marker-end="url(#a)"/>
<rect x="266" y="60" width="680" height="330" rx="26" fill="none" stroke="#FF5A50" stroke-width="6"/>
<text x="606" y="112" text-anchor="middle" font-size="30" font-weight="700" fill="#161616">Repeat until the job is done</text>
<rect x="290" y="140" width="180" height="130" rx="20" fill="#EDEDED" stroke="#CCC5B9" stroke-width="3"/>
<text x="380.0" y="196" text-anchor="middle" font-size="30" font-weight="600" fill="#161616">Decide</text>
<text x="380.0" y="234" text-anchor="middle" font-size="30" font-weight="600" fill="#161616">next step</text>
<rect x="510" y="140" width="180" height="130" rx="20" fill="#FF5A50" stroke="#161616" stroke-width="3"/>
<text x="600.0" y="196" text-anchor="middle" font-size="30" font-weight="600" fill="#161616">Use</text>
<text x="600.0" y="234" text-anchor="middle" font-size="30" font-weight="600" fill="#161616">a tool</text>
<rect x="730" y="140" width="180" height="130" rx="20" fill="#EDEDED" stroke="#CCC5B9" stroke-width="3"/>
<text x="820.0" y="196" text-anchor="middle" font-size="30" font-weight="600" fill="#161616">Look at</text>
<text x="820.0" y="234" text-anchor="middle" font-size="30" font-weight="600" fill="#161616">the result</text>
<line x1="472" y1="205" x2="506" y2="205" stroke="#161616" stroke-width="4" marker-end="url(#a)"/>
<line x1="692" y1="205" x2="726" y2="205" stroke="#161616" stroke-width="4" marker-end="url(#a)"/>
<path d="M820 272 L820 330 L380 330 L380 274" fill="none" stroke="#161616" stroke-width="4" marker-end="url(#a)"/>
<text x="606" y="368" text-anchor="middle" font-size="28" font-weight="400" fill="#686868">back to deciding</text>
<line x1="948" y1="225" x2="998" y2="225" stroke="#161616" stroke-width="5" marker-end="url(#a)"/>
<rect x="1002" y="150" width="178" height="150" rx="20" fill="#EDEDED" stroke="#CCC5B9" stroke-width="3"/>
<text x="1091.0" y="217" text-anchor="middle" font-size="30" font-weight="600" fill="#161616">Answer</text>
<text x="1091.0" y="259" text-anchor="middle" font-size="28" fill="#686868">or action</text>
<text x="600" y="450" text-anchor="middle" font-size="34" font-weight="700" fill="#161616">The flexible part is the choice at each step.</text>
<text x="600" y="498" text-anchor="middle" font-size="30" font-weight="400" fill="#686868">That is the point of an agent, and the part you constrain.</text>
</svg>
