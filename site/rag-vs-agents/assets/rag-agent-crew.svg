<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">RAG, agent, or crew</title><desc id="d">Three cards from left to right. RAG: find it and explain it, search then answer, for example what is the grace period. Agent: look things up and act, a loop with tools, for example what is my payoff and until when. Crew: split the job and add a check, roles hand off work, for example handle this hardship request. An arrow underneath points right: more moving parts, more to test. Start on the left and move right only when you must.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#161616"/></marker></defs>
<rect width="1200" height="560" fill="#F5F3F0"/>
<g transform="translate(0,-60)">
<rect x="30" y="90" width="360" height="390" rx="22" fill="#EDEDED" stroke="#CCC5B9" stroke-width="3"/>
<text x="210.0" y="150" text-anchor="middle" font-size="44" font-weight="700" fill="#161616">RAG</text>
<text x="210.0" y="208" text-anchor="middle" font-size="32" font-weight="600" fill="#161616">Find it and</text>
<text x="210.0" y="248" text-anchor="middle" font-size="32" font-weight="600" fill="#161616">explain it</text>
<text x="210.0" y="312" text-anchor="middle" font-size="28" font-weight="400" fill="#686868">Search, then answer.</text>
<rect x="50" y="352" width="320" height="108" rx="14" fill="#F5F3F0" stroke="#CCC5B9" stroke-width="2"/>
<text x="210.0" y="396" text-anchor="middle" font-size="28" font-weight="400" fill="#161616">"What is the</text>
<text x="210.0" y="434" text-anchor="middle" font-size="28" font-weight="400" fill="#161616">grace period?"</text>
<rect x="420" y="90" width="360" height="390" rx="22" fill="#EDEDED" stroke="#CCC5B9" stroke-width="3"/>
<text x="600.0" y="150" text-anchor="middle" font-size="44" font-weight="700" fill="#161616">Agent</text>
<text x="600.0" y="208" text-anchor="middle" font-size="32" font-weight="600" fill="#161616">Look things up</text>
<text x="600.0" y="248" text-anchor="middle" font-size="32" font-weight="600" fill="#161616">and act</text>
<text x="600.0" y="312" text-anchor="middle" font-size="28" font-weight="400" fill="#686868">Loop with tools.</text>
<rect x="440" y="352" width="320" height="108" rx="14" fill="#F5F3F0" stroke="#CCC5B9" stroke-width="2"/>
<text x="600.0" y="396" text-anchor="middle" font-size="28" font-weight="400" fill="#161616">"What is my payoff,</text>
<text x="600.0" y="434" text-anchor="middle" font-size="28" font-weight="400" fill="#161616">and until when?"</text>
<rect x="810" y="90" width="360" height="390" rx="22" fill="#EDEDED" stroke="#CCC5B9" stroke-width="3"/>
<text x="990.0" y="150" text-anchor="middle" font-size="44" font-weight="700" fill="#161616">Crew</text>
<text x="990.0" y="208" text-anchor="middle" font-size="32" font-weight="600" fill="#161616">Split the job,</text>
<text x="990.0" y="248" text-anchor="middle" font-size="32" font-weight="600" fill="#161616">add a check</text>
<text x="990.0" y="312" text-anchor="middle" font-size="28" font-weight="400" fill="#686868">Roles hand off work.</text>
<rect x="830" y="352" width="320" height="108" rx="14" fill="#F5F3F0" stroke="#CCC5B9" stroke-width="2"/>
<text x="990.0" y="396" text-anchor="middle" font-size="28" font-weight="400" fill="#161616">"Handle this</text>
<text x="990.0" y="434" text-anchor="middle" font-size="28" font-weight="400" fill="#161616">hardship request."</text>
<line x1="40" y1="545" x2="1160" y2="545" stroke="#161616" stroke-width="5" marker-end="url(#a)"/>
<text x="600" y="600" text-anchor="middle" font-size="30" font-weight="400" fill="#686868">More moving parts, more to test</text>
</g>
</svg>
