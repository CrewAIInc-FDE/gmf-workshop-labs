triage_document:
  description: >
    Read inbox document {doc_id} with get_inbox_document and list the work queues
    with list_routing_queues. Extract the customer name, the account id (write
    "missing" if the document has none) and the request type. Choose exactly one
    queue. A complaint or notice that mentions a regulator, discrimination, fraud,
    legal action or bankruptcy goes to compliance_escalation, whatever else it asks
    for. A document that is itself suspicious goes to fraud_review, and one meant for
    another company goes to misrouted. Set the urgency: high if the document mentions
    a regulator, legal action, a deadline, a lapse or a repossession; low if it is a
    routine update with no deadline; otherwise normal. Give a one-sentence reason that
    names the queue rule you applied and quotes the words in the document that
    triggered it.
  expected_output: >
    Exactly these seven lines and nothing else:
    Doc: the document id
    Customer: the customer name
    Account: the account id, or "missing"
    Request: the request type in a few words
    Queue: one queue name from list_routing_queues
    Urgency: high, normal or low
    Reason: one sentence naming the rule and quoting the document
  agent: intake_clerk

route_to_queue:
  description: >
    Route inbox document {doc_id}. Re-read it with get_inbox_document and check the
    clerk's queue and urgency against list_routing_queues. Correct anything the
    document doesn't support, and leave everything else exactly as the clerk wrote it,
    including the quoted Reason. Then call route_document once with the doc id, the
    queue, the one-sentence reason and the urgency.
  expected_output: >
    The clerk's seven lines (Doc, Customer, Account, Request, Queue, Urgency, Reason),
    corrected if needed, then a line "Routing status:" with the status that
    route_document returned, then a line "Review notes:" saying what you changed, or
    "none".
  agent: queue_router
  context: [triage_document]
