# EDIT HERE - this file describes WHO does the work.
# Change the three fields below to describe YOUR agent. Keep each one short and
# specific: a narrow job description gives more reliable results than a broad one.
# Keep the name on the first line (assistant) - crew.py and tasks.yaml refer to it.
