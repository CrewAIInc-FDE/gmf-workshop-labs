[project]
name = "renewal_prep"
version = "0.1.0"
description = "Starter: draft renewal outreach for one account"
requires-python = ">=3.10,<3.14"
dependencies = ["crewai[tools]==1.15.23", "python-dotenv>=1.0"]

[project.scripts]
renewal_prep = "renewal_prep.main:run"
run_crew = "renewal_prep.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
project_id = "79238cf4-c9bc-43dd-a9da-d4ab6cb55f36"
