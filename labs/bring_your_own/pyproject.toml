[project]
name = "bring_your_own"
version = "0.1.0"
description = "Starter: your own problem"
requires-python = ">=3.10,<3.14"
dependencies = ["crewai[tools]==1.15.23", "python-dotenv>=1.0"]

[project.scripts]
bring_your_own = "bring_your_own.main:run"
run_crew = "bring_your_own.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
project_id = "79e266d5-0deb-462a-9400-ce1bd13a2be8"
